language: en
plugin-name: MyVillager
commands:
  claim:
    usage: '/myvillager claim [multiple]'
    description: 'claiming the villager(s)'
  lock:
    usage: '/myvillager lock [multiple]'
    description: 'toggling the villager(s) access permission'
  info:
    usage: '/myvillager info'
    description: 'information of the villager'
  list:
    usage: '/myvillager list'
    description: 'claimed villager(s) list'
  group:
    usage: '/myvillager group'
    description: 'permission group management commands'
    children:
      create:
        usage: 'create <group>'
        description: 'creating permission group'
      delete:
        usage: 'delete <group>'
        description: 'deleting permission group'
      info:
        usage: 'info <group>'
        description: 'information of the group'
      set:
        usage: 'set <group>'
        description: 'adding player or villager(s) into the permission group'
        children:
          player:
            usage: 'player <player>'
            description: 'adding player into the group'
          villager:
            usage: 'villager [multiple]'
            description: 'adding villager(s) into the group'
      unset:
        usage: 'unset <group>'
        description: 'removing player or villager(s) from the permission group'
        children:
          player:
            usage: 'player <player>'
            description: 'removing player from the group'
          villager:
            usage: 'villager [multiple]'
            description: 'removing villager(s) from the group'
  admin:
    usage: '/myvillager admin'
    description: 'admin commands'
    children:
      lock:
        usage: 'lock [multiple]'
        description: 'force toggling the access permission of the villager(s)'
      remove:
        usage: 'remove [multiple]'
        description: 'force removing the owner of the claimed villager(s)'
  reload:
    usage: '/myvillager reload'
    description: 'reload the configuration'

