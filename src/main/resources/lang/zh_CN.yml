language: zh_CN
plugin-name: MyVillager
commands:
  claim:
    usage: '/myvillager claim [multiple]'
    description: '认领村民'
  lock:
    usage: '/myvillager lock [multiple]'
    description: '开关村民访问权限'
  info:
    usage: '/myvillager info'
    description: '村民信息'
  list:
    usage: '/myvillager list'
    description: '已认领村民列表'
  group:
    usage: '/myvillager group'
    description: '权限组管理指令'
    children:
      create:
        usage: 'create <组>'
        description: '创建权限组'
      delete:
        usage: 'delete <组>'
        description: '删除权限组'
      info:
        usage: 'info <组>'
        description: '权限组信息'
      set:
        usage: 'set <组>'
        description: '新增玩家或村民至权限组中'
        children:
          player:
            usage: 'player <玩家>'
            description: '新增玩家至组中'
          villager:
            usage: 'villager [multiple]'
            description: '新增村民至组中'
      unset:
        usage: 'unset <组>'
        description: '将玩家或村民移出权限组'
        children:
          player:
            usage: 'player <玩家>'
            description: '从组中移出玩家'
          villager:
            usage: 'villager [multiple]'
            description: '从组中移出村民'
  admin:
    usage: '/myvillager admin'
    description: '管理指令'
    children:
      lock:
        usage: 'lock [multiple]'
        description: '强制开关村民的访问权限'
      remove:
        usage: 'remove [multiple]'
        description: '强制移除已被认证村民的认证信息'
  reload:
    usage: '/myvillager reload'
    description: '重载配置文件'

