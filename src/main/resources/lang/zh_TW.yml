language: zh_TW
plugin-name: MyVillager
commands:
  claim:
    usage: '/myvillager claim [multiple]'
    description: '認領村民'
  lock:
    usage: '/myvillager lock [multiple]'
    description: '開關村民訪問權限'
  info:
    usage: '/myvillager info'
    description: '村民資訊'
  list:
    usage: '/myvillager list'
    description: '已認領村民列表'
  group:
    usage: '/myvillager group'
    description: '權限組管理指令'
    children:
      create:
        usage: 'create <組>'
        description: '建立權限組'
      delete:
        usage: 'delete <組>'
        description: '刪除權限組'
      info:
        usage: 'info <組>'
        description: '權限組資訊'
      set:
        usage: 'set <組>'
        description: '新增玩家或村民至權限組中'
        children:
          player:
            usage: 'player <玩家>'
            description: '新增玩家至組中'
          villager:
            usage: 'villager [multiple]'
            description: '新增村民至組中'
      unset:
        usage: 'unset <組>'
        description: '將玩家或村民移出權限組'
        children:
          player:
            usage: 'player <玩家>'
            description: '從組中移出玩家'
          villager:
            usage: 'villager [multiple]'
            description: '從組中移出村民'
  admin:
    usage: '/myvillager admin'
    description: '管理指令'
    children:
      lock:
        usage: 'lock [multiple]'
        description: '強制開關村民的訪問權限'
      remove:
        usage: 'remove [multiple]'
        description: '強制移除已被認證村民的認證資訊'
  reload:
    usage: '/myvillager reload'
    description: '重新載入配置檔案'

